name: release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[publish-alpha]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-alpha.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'FastPath AI v0.1.0-alpha.2' }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: dist/*
